name: Import reviewed Day candidate
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'Flix-Remote/Flix-Remote'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/day-appfair
          fetch-depth: 0
      - name: Import reviewed code; workflows are maintained through the web UI
        env:
          REVIEWED_COMMIT: bc5ba23c018c55b4272e0c1d46fd7b1e95e44c9c
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/Ahmedzx054/flix-home-remote.git "$REVIEWED_COMMIT"
          test "$(git rev-parse FETCH_HEAD)" = "$REVIEWED_COMMIT"
          git restore --source="$REVIEWED_COMMIT" --staged --worktree -- . ':(exclude).github/workflows'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "Import reviewed Day code $REVIEWED_COMMIT"
          git push origin HEAD:refs/heads/codex/day-appfair
